name: Release

# Publishes the npm package when a `vX.Y.Z` tag is pushed. Action tags (`action-v*`) do not match.
# Publishing uses npm trusted publishing (OIDC): no token is stored, and npm attaches provenance.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Require the tag to match the package and to be on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${version}."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${TAG} points at a commit that is not on main."
            exit 1
          fi
      - name: Require an npm that supports trusted publishing
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error(`npm ${process.argv[1]} is older than 11.5.1`); process.exit(1); }
          ' "$(npm --version)"
      - run: npm ci --ignore-scripts
      - run: npm run action:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run package:check
      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # A prerelease goes to `next`, so `latest` keeps pointing at the last stable release.
          case "${TAG}" in
            *-*) npm publish --tag next ;;
            *) npm publish ;;
          esac
